name: Update Profile Card

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: profile-card-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Test profile card generator
        run: python -m pytest -q

      - name: Update profile card SVGs
        env:
          METRICS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: yacosta738
        run: python scripts/profile_card.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card-dark.svg assets/profile-card-light.svg cache/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile card stats"
            # Pull with rebase to handle concurrent changes
            git pull --rebase origin main || {
              echo "Rebase failed, aborting and cleaning up"
              git rebase --abort
              exit 1
            }
            git push
          fi
